---
- name: Configurar vm-microservices (Docker y los tres microservicios)
  hosts: microservices
  vars:
    app_dir: /opt/microapp
    mysql_root_password: "{{ lookup('password', playbook_dir + '/secrets/mysql_root chars=ascii_letters,digits length=20') }}"
    flask_secret_key: "{{ lookup('password', playbook_dir + '/secrets/flask_key chars=ascii_letters,digits length=32') }}"

  tasks:
    - name: Instalar paquetes previos
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Crear carpeta de llaves de apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Descargar la llave GPG de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Agregar el repositorio de Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Instalar Docker y el plugin de compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Habilitar Docker al inicio y dejarlo corriendo
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Crear carpetas de la aplicacion
      file:
        path: "{{ app_dir }}/db"
        state: directory
        mode: "0755"

    - name: Copiar el docker-compose.yml
      copy:
        src: docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copiar los scripts SQL de las bases de datos
      copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/db/{{ item }}"
        mode: "0644"
      loop:
        - init-users.sql
        - init-products.sql
        - init-orders.sql

    - name: Crear el archivo .env con las claves
      copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          MYSQL_ROOT_PASSWORD={{ mysql_root_password }}
          USERS_DB_NAME=users_db
          PRODUCTS_DB_NAME=products_db
          ORDERS_DB_NAME=orders_db
          FLASK_SECRET_KEY={{ flask_secret_key }}
      no_log: true

    - name: Levantar los contenedores
      command: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

- name: Configurar vm-haproxy (instalar HAProxy)
  hosts: haproxy
  tasks:
    - name: Instalar HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Habilitar HAProxy al inicio y dejarlo corriendo
      systemd:
        name: haproxy
        enabled: yes
        state: started
