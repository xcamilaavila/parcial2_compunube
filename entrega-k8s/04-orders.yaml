apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      restartPolicy: Always
      containers:
        - name: orders-service
          image: xcamilaavila/orders-service:v1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "$MYSQL_DB_SERVICE_HOST users_db products_db orders_db" >> /etc/hosts
              exec python run.py
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secretos
                  key: MYSQL_ROOT_PASSWORD
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secretos
                  key: FLASK_SECRET_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: orders-service
  ports:
    - port: 3003
      targetPort: 3003
